name = "tg-file-store"
main = "src/index.js"
compatibility_date = "2024-11-20"

# 页面脚本是运行时用 Function.toString() 拼出来的。esbuild 的 keepNames 会把函数
# 包成 __name(fn, "name")，序列化后浏览器拿不到 __name 定义，整页脚本会直接报错。
keep_names = false

[vars]
CHAT_ID = "5504160733"

[[d1_databases]]
binding = "DB"
database_name = "file_go"
database_id = "49a2ca6c-c82c-45e4-b222-9861b951e3da"

# 每 5 分钟清理一次待删除的 Telegram 消息和过期上传会话
[triggers]
crons = ["*/5 * * * *"]
